<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PolyVerse API Documentation</title>
    <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui.css" />
    <style>
        html { box-sizing: border-box; overflow-y: scroll; }
        *, *::before, *::after { box-sizing: inherit; }
        body { margin: 0; background: #fafafa; }
        .swagger-ui .topbar { display: none; }
        /* Custom header */
        .api-header {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: #fff;
            padding: 32px 48px;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        .api-header h1 {
            margin: 0 0 8px 0;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .api-header p {
            margin: 0;
            font-size: 14px;
            opacity: 0.8;
            line-height: 1.5;
        }
        .api-header .badges {
            margin-top: 12px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .api-header .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .badge-sveltekit { background: #ff3e00; color: #fff; }
        .badge-activitypub { background: #6364ff; color: #fff; }
        .badge-did { background: #00b4d8; color: #fff; }
        .badge-bun { background: #fbf0df; color: #3a3a3a; }
    </style>
</head>
<body>
    <div class="api-header">
        <h1>🌌 PolyVerse API</h1>
        <p>Federated, decentralized social media platform — ActivityPub + W3C DID</p>
        <div class="badges">
            <span class="badge badge-sveltekit">SvelteKit</span>
            <span class="badge badge-bun">Bun</span>
            <span class="badge badge-activitypub">ActivityPub</span>
            <span class="badge badge-did">DID:web</span>
        </div>
    </div>
    <div id="swagger-ui"></div>

    <script src="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui-bundle.js" crossorigin></script>
    <script>
        window.onload = () => {
            SwaggerUIBundle({
                url: './openapi.json',
                dom_id: '#swagger-ui',
                deepLinking: true,
                presets: [
                    SwaggerUIBundle.presets.apis,
                    SwaggerUIBundle.SwaggerUIStandalonePreset
                ],
                layout: 'BaseLayout',
                defaultModelsExpandDepth: 2,
                defaultModelExpandDepth: 2,
                docExpansion: 'list',
                filter: true,
                showExtensions: true,
                showCommonExtensions: true,
                tryItOutEnabled: false
            });
        };
    </script>
</body>
</html>
